name: Status Page

# Builds and publishes the public CI/status dashboard to GitHub Pages
# (https://newwave4org.github.io/NewWave4.org-frontend-new/). Self-contained
# rather than stitched together from other workflows' artifacts: e2e.yml only
# runs on PRs into main + nightly + manual, so there's no guarantee a fresh
# E2E artifact exists for an arbitrary trigger SHA. Running its own
# unit-test + E2E pass costs a few extra CI minutes but guarantees the page
# always reflects one consistent, fresh check. See scripts/status-page/.
#
# Triggers off release.yml's completion (workflow_run), not push: main
# directly -- both used to fire on the same push event with no ordering
# guarantee, so this page could (and did, on 2026-07-26) query the GitHub
# Releases API and publish the *previous* stable version because
# semantic-release hadn't finished publishing the new one yet. workflow_run
# also means this correctly re-fires after a manual release.yml dispatch (the
# [skip ci] escape hatch documented in docs/known-issues.md), not just a real
# push.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # nightly, offset from e2e.yml's 0 3 * * *
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only build after a *successful* Release run -- a failed release
    # shouldn't republish the dashboard against a possibly half-updated
    # state. schedule/workflow_dispatch have no workflow_run context, so this
    # only applies when that's actually the trigger.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Pin to the exact commit release.yml just finished with, not
          # whatever main happens to be at the moment this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run unit tests with coverage
        continue-on-error: true
        run: npm run test:coverage

      # Same Docker build/run/wait pattern as e2e.yml -- see that file for
      # why Playwright's built-in webServer isn't used directly.
      - name: Generate .env file
        uses: ./.github/actions/generate-env
        with:
          paypal_client_id: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          stripe_publishable_keys: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS }}
          stripe_webhook_url: ${{ secrets.NEXT_PUBLIC_STRIPE_WEBHOOK_URL }}
          newwave_api_url: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image for E2E
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: newwave4-frontend-status:${{ github.sha }}

      - name: Start app container
        run: docker run -d --name status-app -p 3000:3000 newwave4-frontend-status:${{ github.sha }}

      - name: Wait for app to become ready
        run: |
          for i in $(seq 1 30); do
            # Probe the same origin the tests use (localhost, not 127.0.0.1) so a
            # name-resolution mismatch -- localhost resolving to ::1 while docker
            # -p binds IPv4 only -- fails here with a clear message rather than
            # resurfacing later as unexplained test failures.
            if wget -q -O - --timeout=5 --tries=1 http://localhost:3000/robots.txt; then
              echo "App is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::App never became ready within 60s"
          docker logs status-app
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        continue-on-error: true
        run: npm run test:e2e
        env:
          # localhost, NOT 127.0.0.1: they are different HTTP origins, and the
          # backend's CORS allow-list (SecurityConfig.corsConfigurationSource)
          # contains only http://localhost:3000. Verified against the real API --
          # a preflight from http://127.0.0.1:3000 returns 403 with no CORS
          # headers, so the browser blocks the login POST before it is sent.
          # That silently broke every credential-gated spec: login never
          # completed, the page stayed on /admin, and the failure was
          # indistinguishable from bad credentials.
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Dump app container logs
        if: always()
        run: docker logs status-app || true

      - name: Stop app container
        if: always()
        run: docker rm -f status-app || true

      - name: Fetch release info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .status-data
          releases=$(gh api "repos/${{ github.repository }}/releases" --paginate)
          stable=$(echo "$releases" | jq '[.[] | select(.prerelease == false)][0] // null | if . == null then null else {tag: .tag_name, name: .name, url: .html_url, publishedAt: .published_at} end')
          prerelease=$(echo "$releases" | jq '[.[] | select(.prerelease == true)][0] // null | if . == null then null else {tag: .tag_name, name: .name, url: .html_url, publishedAt: .published_at} end')
          # Full newest-first stable list, not just the newest one: the drift
          # check needs it to say *how far* behind a running version is, by
          # looking up its index in this list.
          stableList=$(echo "$releases" | jq '[.[] | select(.prerelease == false) | {tag: .tag_name, url: .html_url, publishedAt: .published_at}]')
          jq -n --argjson stable "$stable" --argjson prerelease "$prerelease" --argjson stableList "$stableList" \
            '{stable: $stable, prerelease: $prerelease, stableList: $stableList}' > .status-data/releases.json

      - name: Check staging reachability
        if: always()
        run: |
          mkdir -p .status-data
          set +e
          # new.newwave4.org, not staging.newwave4.org -- the latter is only
          # helm/frontend-chart/values.yaml's committed *default* ingress
          # host; the real staging deployment's actual host comes from the
          # secret-sourced VALUES_YAML overlay in deploy-to-kubernetes.yml
          # (confirmed via `kubectl -n staging get ingress`).
          result=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 5 https://new.newwave4.org/robots.txt)
          code=$(echo "$result" | cut -d' ' -f1)
          time_s=$(echo "$result" | cut -d' ' -f2)
          set -e
          ok=false
          if [ "$code" = "200" ]; then ok=true; fi
          latency_ms=$(node -e "console.log(Math.round(parseFloat('${time_s:-0}') * 1000))")
          checked_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n --argjson ok $ok --arg httpCode "${code:-0}" --argjson latencyMs "$latency_ms" --arg checkedAt "$checked_at" \
            '{ok: $ok, httpCode: ($httpCode | tonumber), latencyMs: $latencyMs, checkedAt: $checkedAt}' > .status-data/staging-health.json

      # Asks the deployed app which build it actually is (app/api/version), so
      # the page can compare it against the newest published release. The
      # reachability check above deliberately stays on /robots.txt -- it's the
      # same cheap, middleware-free path kubelet probes (see the crash-loop
      # incident in docs/known-issues.md), and "is it up" should not start
      # depending on "does it have a version endpoint".
      - name: Check staging running version
        if: always()
        run: |
          mkdir -p .status-data
          set +e
          code=$(curl -s -o /tmp/version.json -w '%{http_code}' --max-time 5 https://new.newwave4.org/api/version)
          set -e
          payload=null
          # An HTTP 200 alone is not proof the endpoint exists: any image built
          # before this route was added answers /api/version with Next's HTML
          # 404 page. Require parseable JSON carrying a version, so a
          # pre-endpoint deployment degrades to an honest "unknown" rather than
          # a silently false "in sync".
          if [ "$code" = "200" ] && jq -e '.version' /tmp/version.json > /dev/null 2>&1; then
            payload=$(cat /tmp/version.json)
          fi
          jq -n --arg httpCode "${code:-0}" --argjson payload "$payload" \
                --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{httpCode: ($httpCode | tonumber), payload: $payload, fetchedAt: $fetchedAt}' \
            > .status-data/staging-version.json
          cat .status-data/staging-version.json

      - name: Generate status page
        run: node scripts/status-page/generate.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: status-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
