name: CI

# Feature/fix branch pushes and PRs. Pushes to main/development are owned by
# release.yml instead — this workflow never pushes a real semver image tag.
on:
  pull_request:
    branches:
      - development
      - main
      - 'feature-*'
      - 'feature/*'
      - 'fix-*'
  push:
    branches:
      - 'feature-*'
      - 'feature/*'
      - 'fix-*'
  workflow_dispatch:

# A newer push to the same PR (or branch) makes the older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change can affect the build at all. Deliberately NOT
  # done with `paths-ignore` on the trigger above: three of this workflow's
  # checks are *required* by branch protection, and a workflow skipped by path
  # filtering never reports them at all — the PR then waits on a check that can
  # never arrive and is unmergeable forever. Skipping the job instead still
  # produces a check run (conclusion: skipped), which satisfies the requirement.
  #
  # Fails safe: anything that is not clearly documentation counts as code, and
  # non-pull_request events always run the full gates.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether anything outside docs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull_request event — running full gates."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Documentation-only means: docs/, or a top-level *.md. Everything
          # else — including .github/, package.json and any source file — is
          # code. Workflow changes must always be exercised by the real gates.
          if printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Non-documentation changes present — running full gates."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change — skipping build gates."
          fi

  # NOT `if: ... == 'true'`. Skipping this call outright means its child jobs
  # never exist, so the required contexts `quality-gates / casing-guard`,
  # `/ unit-test` and `/ docker-smoke` never report and the PR is blocked on
  # checks that can never arrive — verified the hard way on PR #503. Passing a
  # flag instead keeps every job running and reporting, doing no work.
  quality-gates:
    needs: changes
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_quality-gates.yml
    with:
      run_full: ${{ needs.changes.outputs.code == 'true' }}
      # Same-repo PRs push the image they test, so e2e (and anyone checking a
      # PR by hand) runs that exact build. Dependabot and fork PRs get no
      # write token: built and smoke-tested locally only.
      push_image: >-
        ${{ github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
        && needs.changes.outputs.code == 'true' }}
      extra_tag: >-
        ${{ github.event_name == 'pull_request'
        && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha)
        || '' }}
    secrets: inherit

  # The development -> main promotion PR: browser tests against the real
  # staging API, on the image docker-smoke just built and pushed (it used to
  # build its own). Nightly and on-demand runs live in e2e.yml.
  e2e:
    name: e2e
    needs: [changes, quality-gates]
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'main'
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.quality-gates.outputs.image }}
    steps:
      - name: Require the image under test
        run: |
          if [ -z "${IMAGE}" ]; then
            echo "::error::quality-gates pushed no image for this PR (only same-repo, non-Dependabot PRs push one)."
            exit 1
          fi
          echo "Testing ${IMAGE}"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Runtime config (staging values)
        uses: ./.github/actions/generate-env
        with:
          stripe_publishable_keys: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS }}
          stripe_webhook_url: ${{ secrets.NEXT_PUBLIC_STRIPE_WEBHOOK_URL }}
          newwave_api_url: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL }}
          site_url: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the tested image
        run: docker run -d --name e2e-app -p 3000:3000 --env-file .env "${IMAGE}"

      - name: Wait for app to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 5 http://localhost:3000/robots.txt; then
              echo "App is ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::App never became ready within 60s"
          docker logs e2e-app
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_NEWWAVE_API_URL: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL }}

      - name: Dump app container logs
        if: always()
        run: docker logs e2e-app || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
