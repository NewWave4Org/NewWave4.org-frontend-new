name: CI

# Feature/fix branch pushes and PRs. Pushes to main/development are owned by
# release.yml instead — this workflow never pushes a real semver image tag.
on:
  pull_request:
    branches:
      - development
      - main
      - 'feature-*'
      - 'feature/*'
      - 'fix-*'
  push:
    branches:
      - 'feature-*'
      - 'feature/*'
      - 'fix-*'
  workflow_dispatch:

jobs:
  # Decides whether this change can affect the build at all. Deliberately NOT
  # done with `paths-ignore` on the trigger above: three of this workflow's
  # checks are *required* by branch protection, and a workflow skipped by path
  # filtering never reports them at all — the PR then waits on a check that can
  # never arrive and is unmergeable forever. Skipping the job instead still
  # produces a check run (conclusion: skipped), which satisfies the requirement.
  #
  # Fails safe: anything that is not clearly documentation counts as code, and
  # non-pull_request events always run the full gates.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether anything outside docs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull_request event — running full gates."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Documentation-only means: docs/, or a top-level *.md. Everything
          # else — including .github/, package.json and any source file — is
          # code. Workflow changes must always be exercised by the real gates.
          if printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Non-documentation changes present — running full gates."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change — skipping build gates."
          fi

  quality-gates:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_quality-gates.yml
    secrets: inherit

  # Ephemeral, traceable image for manual reviewer pulls on PRs into development.
  # Never a real semver, never auto-deployed anywhere.
  docker-pr-publish:
    name: docker-pr-publish
    needs: quality-gates
    # Skipped for Dependabot, which GitHub runs without repo secrets. This job
    # exists to give a reviewer a pullable image; built from placeholder env it
    # would point at https://ci.invalid and be actively misleading to anyone who
    # ran it. docker-smoke already proves a dependency bump still builds and
    # boots (it falls back to .env.ci deliberately — see _quality-gates.yml),
    # and that is the check that matters here. Dependabot's token is also
    # read-only for packages, so the push would fail even if the build did not.
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'development'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      - name: Generate .env file
        uses: ./.github/actions/generate-env
        with:
          paypal_client_id: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          stripe_publishable_keys: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS }}
          stripe_webhook_url: ${{ secrets.NEXT_PUBLIC_STRIPE_WEBHOOK_URL }}
          newwave_api_url: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL }}
          site_url: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build and push (PR tag only)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ env.ORG }}/newwave4-frontend:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
