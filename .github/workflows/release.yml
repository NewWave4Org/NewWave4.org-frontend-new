name: Release

# Push-based (not PR-based) release automation: semantic-release runs directly
# on push to main/development, so it needs no release PR of its own — which
# matters because restrict-main-merges.yml only accepts PRs into main from a
# branch literally named `development`. See
# docs/decisions/0002-semantic-release-over-release-please.md.
#
# workflow_dispatch is a manual escape hatch for firing a release that a push
# silently skipped. It was originally required because GitHub's auto-generated
# squash-merge body concatenates every squashed commit verbatim, and
# `development` accumulates `chore(release): ...` bump commits between
# promotions -- so a promotion's squash commit inherited a CI-skip marker in its
# body and GitHub skipped ALL workflows for that push, silently. Confirmed for
# real on 2026-07-19 (PR #416) and again on 2026-07-29 (PR #441), the latter
# recovered via this very dispatch.
#
# Both sources of that are now fixed: the repo's squash setting is PR_BODY
# rather than COMMIT_MESSAGES (so bodies are never inherited), and the bump
# commits no longer carry the marker at all -- the quality-gates job below
# guards on the commit subject instead. release-guard.yml watches for a main
# HEAD with no Release run in case something slips through anyway.
#
# Keeping the dispatch regardless: it costs nothing and is the recovery path for
# any future case where a push doesn't produce the release it should.
on:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Don't re-release semantic-release's own version-bump commit. This replaces
  # the `[skip ci]` marker that used to live in release.config.js's commit
  # message: that marker worked, but GitHub applies it to every workflow and
  # every trigger type for the commit, so it also silenced ci.yml,
  # pr-title-lint, restrict-main-merges and e2e on any PR whose head SHA landed
  # on a bump commit -- leaving promotion PRs with zero checks and permanently
  # unmergeable. Guarding here scopes the behaviour to the only workflow that
  # ever needed it.
  #
  # The event_name clause keeps the workflow_dispatch escape hatch working:
  # github.event.head_commit exists only for push events, and startsWith(null,
  # ...) would otherwise make a manual dispatch evaluate to false and skip.
  #
  # `release` needs this job, so it skips transitively -- as do docker-publish,
  # helm-publish and deploy-staging via their own needs chains.
  quality-gates:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    uses: ./.github/workflows/_quality-gates.yml
    secrets: inherit

  release:
    name: release
    needs: quality-gates
    runs-on: ubuntu-latest
    # semantic-release's success phase comments/labels every PR referenced in
    # the released commit range. On the very first release (no prior tag),
    # that can be the entire repo history -- ~400 PRs at roughly 1/sec here,
    # several minutes of genuine, correct work with no visible progress
    # between GitHub Actions' step-level status updates. Cap it generously
    # rather than leaving GitHub's default (up to 6h) in place, so a truly
    # hung run fails loudly instead of silently burning CI minutes forever.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Branch protection on main/development requires 1 PR approval and
          # blocks direct pushes from non-admin identities — the default
          # GITHUB_TOKEN cannot push the release commit/tag. RELEASE_ADMIN_TOKEN
          # must be a fine-grained PAT from a repo admin account. See
          # docs/decisions/0002-semantic-release-over-release-please.md.
          token: ${{ secrets.RELEASE_ADMIN_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run semantic-release
        id: semantic
        # Plain `npx semantic-release` never writes new_release_published/
        # new_release_version to $GITHUB_OUTPUT (verified: no reference to
        # GITHUB_OUTPUT or @actions/core anywhere in its dependency tree) —
        # this wrapper uses the documented Node API instead so the downstream
        # docker-publish/helm-publish/deploy-staging jobs actually gate correctly.
        run: node scripts/release/run-semantic-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}

  docker-publish:
    name: docker-publish
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      - name: Generate .env file
        uses: ./.github/actions/generate-env
        with:
          paypal_client_id: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          stripe_publishable_keys: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS }}
          stripe_webhook_url: ${{ secrets.NEXT_PUBLIC_STRIPE_WEBHOOK_URL }}
          newwave_api_url: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL }}

      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Feeds the Dockerfile's version-stamping ARGs, which the running
      # container reports back via /api/version and the status page compares
      # against the newest published release to detect deploy drift.
      #
      # `git rev-parse HEAD`, not github.sha: this job checks out
      # `ref: github.ref_name`, so it builds the branch HEAD *including*
      # semantic-release's `chore(release): X.Y.Z` bump commit -- github.sha is
      # the commit that triggered the run, one behind whatever is actually in
      # the image.
      - name: Stamp build metadata
        id: stamp
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ env.ORG }}/newwave4-frontend:${{ needs.release.outputs.new_release_version }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.new_release_version }}
            IMAGE_TAG=${{ needs.release.outputs.new_release_version }}
            GIT_COMMIT=${{ steps.stamp.outputs.commit }}
            BUILD_TIME=${{ steps.stamp.outputs.built_at }}

      - name: Alias :latest to this release (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.ORG }}/newwave4-frontend:latest \
            ghcr.io/${{ env.ORG }}/newwave4-frontend:${{ needs.release.outputs.new_release_version }}

  helm-publish:
    name: helm-publish
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Checkout (branch HEAD, includes the semantic-release version-bump commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.4'

      - name: Login to GHCR for Helm (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package Helm chart
        id: pkg
        run: |
          set -euo pipefail
          PKG_FILE=$(helm package helm/frontend-chart | awk '{print $NF}')
          echo "pkg=${PKG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Push Helm chart to GHCR
        run: |
          set -euo pipefail
          helm push "${{ steps.pkg.outputs.pkg }}" oci://ghcr.io/${{ env.ORG }}/charts

  deploy-staging:
    name: deploy-staging
    needs: [release, docker-publish, helm-publish]
    if: needs.release.outputs.new_release_published == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      namespace: staging
      chart_version: ${{ needs.release.outputs.new_release_version }}
      image_tag: ${{ needs.release.outputs.new_release_version }}
    secrets: inherit
