name: Release

# Push-based (not PR-based) release automation: semantic-release runs directly
# on push to main/development, so it needs no release PR of its own — which
# matters because restrict-main-merges.yml only accepts PRs into main from a
# branch literally named `development`. See
# docs/decisions/0002-semantic-release-over-release-please.md.
#
# workflow_dispatch is a manual escape hatch for firing a release that a push
# silently skipped. It was originally required because GitHub's auto-generated
# squash-merge body concatenates every squashed commit verbatim, and
# `development` accumulates `chore(release): ...` bump commits between
# promotions -- so a promotion's squash commit inherited a CI-skip marker in its
# body and GitHub skipped ALL workflows for that push, silently. Confirmed for
# real on 2026-07-19 (PR #416) and again on 2026-07-29 (PR #441), the latter
# recovered via this very dispatch.
#
# Both sources of that are now fixed: the repo's squash setting is PR_BODY
# rather than COMMIT_MESSAGES (so bodies are never inherited), and the bump
# commits no longer carry the marker at all -- the quality-gates job below
# guards on the commit subject instead. release-guard.yml watches for a main
# HEAD with no Release run in case something slips through anyway.
#
# Keeping the dispatch regardless: it costs nothing and is the recovery path for
# any future case where a push doesn't produce the release it should.
#
# The `force_build` input covers the *other* silent-skip: a push that DID run
# Release, but where semantic-release found no releasable commit (merge commits,
# `feature:` / bare `fix slider` subjects) and so published nothing -- leaving
# publish, helm-publish and deploy-staging all `skipped` and `:latest`
# pointing at the previous release. Happened for real on 2026-08-29 (PR #527).
# With force_build, quality-gates builds the branch HEAD anyway and publish tags
# it `<package.json version>-<short sha>` (never a semver that could collide with
# a real release), re-aliases `:latest` on main, and deploy-staging rolls it
# out against the already-published chart version from Chart.yaml. No tag,
# GitHub Release or chart is produced -- the next conventional commit still
# cuts the real version.
on:
  push:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build and publish an image from the branch HEAD even if semantic-release publishes nothing (tag: <version>-<sha>; on main also re-aliases :latest; deploys staging)'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

#
# Build once, promote (docs/ci-cd.md):
#   development push: quality gates build and push the image (sha-<commit>);
#     a release tags that digest X.Y.Z-dev.N and deploys it to staging.
#   main push (a merge from development): `plan` finds development's image and
#     checks main's code is identical to what it was built from
#     (scripts/release/promotable.mjs). If so, that same digest becomes X.Y.Z,
#     newwave4-frontend-production:X.Y.Z and :latest, with no rebuild and no
#     repeat of gates it already passed. Anything that could change the image
#     means a fresh build and the full gates instead.

jobs:
  # Decides what this run builds.
  #
  # Skips semantic-release's own version-bump commit. This replaces the
  # `[skip ci]` marker release.config.js used to write: GitHub applies that
  # marker to every workflow and trigger type, which silenced ci.yml,
  # pr-title-lint, restrict-main-merges and e2e on promotion PRs whose head
  # landed on a bump commit (docs/known-issues.md). The event_name clause keeps
  # workflow_dispatch working: head_commit exists only for push events.
  # Everything downstream needs this job, so it all skips with it.
  plan:
    name: plan
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      promote_from: ${{ steps.find.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      - name: GHCR Login
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find a tested image to promote (main only)
        id: find
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REPO: ghcr.io/${{ env.ORG }}/newwave4-frontend
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main only takes merges from development (restrict-main-merges.yml);
          # the merge's second parent is development's tip.
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::notice::HEAD is not a merge from development; building from scratch."
            exit 0
          fi
          DEV_VERSION=$(git show 'HEAD^2:package.json' | jq -r .version)
          CANDIDATE="${REPO}:${DEV_VERSION}"
          if ! DIGEST=$(docker buildx imagetools inspect "${CANDIDATE}" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
            echo "::notice::No image ${CANDIDATE}; building from scratch."
            exit 0
          fi

          # Trust nothing the image says about itself. Promote only a digest
          # with a provenance attestation signed by THIS workflow on a push to
          # development (the `attest` job below). Tags and labels can be written
          # by anything holding packages:write; that signature cannot.
          if ! VERIFIED=$(gh attestation verify "oci://${REPO}@${DIGEST}" \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                --source-ref refs/heads/development \
                --deny-self-hosted-runners \
                --format json 2>/tmp/verify.err); then
            echo "::notice::${CANDIDATE} (${DIGEST}) has no valid attestation from release.yml on development; building from scratch."
            sed 's/^/  /' /tmp/verify.err
            exit 0
          fi
          # The commit the attested build ran on, from the signed certificate.
          SOURCE=$(jq -r '[.. | .sourceRepositoryDigest? // empty] | first // empty' <<<"${VERIFIED}")
          if [ -z "${SOURCE}" ] || ! git cat-file -e "${SOURCE}^{commit}" 2>/dev/null; then
            echo "::notice::The attestation for ${DIGEST} names no commit in this repo ('${SOURCE}'); building from scratch."
            exit 0
          fi
          if ! git merge-base --is-ancestor "${SOURCE}" 'HEAD^2'; then
            echo "::notice::${SOURCE} is not in development's history; building from scratch."
            exit 0
          fi

          if node scripts/release/promotable.mjs "${SOURCE}" HEAD; then
            echo "image=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "::notice::Promoting ${CANDIDATE} (${DIGEST}, attested build of ${SOURCE}) without a rebuild."
          else
            echo "::notice::main differs from what ${CANDIDATE} was built from; building from scratch with the full gates."
          fi

  # Full gates and the one image build, unless plan found a tested image to
  # promote. The image is pushed as sha-<commit>; publish tags that digest.
  quality-gates:
    needs: plan
    if: needs.plan.outputs.promote_from == ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_quality-gates.yml
    with:
      push_image: true
    secrets: inherit

  # Signs a build provenance attestation for the image quality-gates just
  # built and pushed, binding its digest to this workflow, this ref and this
  # commit. `plan` on main promotes only digests attested from development.
  attest:
    name: attest
    needs: quality-gates
    if: needs.quality-gates.result == 'success' && needs.quality-gates.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Split the image reference
        id: img
        env:
          IMAGE: ${{ needs.quality-gates.outputs.image }}
        run: |
          echo "name=${IMAGE%@*}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.img.outputs.digest }}

  release:
    name: release
    needs: [plan, quality-gates, attest]
    # Runs after the gates passed and the image was attested, or after plan
    # chose a promotion (gates are then skipped on purpose: the promoted image
    # already passed them, and main's code is identical to what they tested).
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && ((needs.quality-gates.result == 'success' && needs.attest.result == 'success')
          || (needs.quality-gates.result == 'skipped' && needs.plan.outputs.promote_from != ''))
    runs-on: ubuntu-latest
    # semantic-release's success phase comments/labels every PR referenced in
    # the released commit range; on a first release that can be the whole
    # history. Cap it rather than leave GitHub's 6h default.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      # What publish / deploy-staging consume. On a real release these equal
      # new_release_version; on a force_build dispatch they fall back to
      # `<package.json version>-<short sha>` for the image and Chart.yaml's
      # version for the chart. See the `resolve` step.
      publish_image: ${{ steps.resolve.outputs.publish_image }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      chart_version: ${{ steps.resolve.outputs.chart_version }}
      # The tested image this release publishes, as repo@sha256:digest.
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Branch protection blocks direct pushes from non-admin identities, so
          # the default GITHUB_TOKEN cannot push the release commit/tag.
          # RELEASE_ADMIN_TOKEN is a fine-grained PAT from a repo admin. See
          # docs/decisions/0002-semantic-release-over-release-please.md.
          token: ${{ secrets.RELEASE_ADMIN_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run semantic-release
        id: semantic
        # Plain `npx semantic-release` never writes its outputs to
        # $GITHUB_OUTPUT; this wrapper uses the Node API so the jobs below gate
        # correctly.
        run: node scripts/release/run-semantic-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}

      # Decide what, if anything, to publish. Runs after semantic-release so a
      # force_build dispatch that *does* find a releasable commit still takes
      # the normal versioned path rather than a `-<sha>` tag.
      - name: Resolve image tag and chart version
        id: resolve
        env:
          RELEASED: ${{ steps.semantic.outputs.new_release_published }}
          RELEASED_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build == true }}
          SOURCE_IMAGE: ${{ needs.plan.outputs.promote_from || needs.quality-gates.outputs.image }}
        run: |
          set -euo pipefail
          if [ "$RELEASED" != "true" ] && [ "$FORCE_BUILD" != "true" ]; then
            echo "publish_image=false" >> "$GITHUB_OUTPUT"
            echo "No release published and force_build not set -- nothing to publish."
            exit 0
          fi
          if [ -z "$SOURCE_IMAGE" ]; then
            echo "::error::Nothing to publish: no promoted image and quality-gates pushed none."
            exit 1
          fi
          echo "image=${SOURCE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "publish_image=true" >> "$GITHUB_OUTPUT"
          if [ "$RELEASED" = "true" ]; then
            echo "image_tag=${RELEASED_VERSION}" >> "$GITHUB_OUTPUT"
            echo "chart_version=${RELEASED_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Release ${RELEASED_VERSION} published -- publishing ${SOURCE_IMAGE}."
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            CHART_VERSION=$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' helm/frontend-chart/Chart.yaml)
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            if [ -z "$PKG_VERSION" ] || [ -z "$CHART_VERSION" ]; then
              echo "::error::Could not read package.json version ('${PKG_VERSION}') or Chart.yaml version ('${CHART_VERSION}')."
              exit 1
            fi
            echo "image_tag=${PKG_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
            echo "::notice::No release published; force_build set -- publishing ${SOURCE_IMAGE} as ${PKG_VERSION}-${SHORT_SHA} against chart ${CHART_VERSION} (must already be in GHCR)."
          fi

  # Tags the tested digest; never builds. On main the same digest also becomes
  # :latest and newwave4-frontend-production:<tag>, which is what
  # deploy-to-kubernetes.yml pulls for production. Each tag is read back and
  # must resolve to exactly that digest.
  publish:
    name: publish
    needs: release
    # !cancelled(): on a promotion, quality-gates and attest are skipped, and a
    # bare `if:` implies success() over every ancestor job, which a skipped
    # ancestor fails -- so this job would skip even after a real release
    # (2.2.3 shipped no image that way). Gate on release's own result instead.
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && needs.release.outputs.publish_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.tag.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the tested image
        id: tag
        env:
          SOURCE: ${{ needs.release.outputs.image }}
          TAG: ${{ needs.release.outputs.image_tag }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${ORG}/newwave4-frontend"
          DIGEST="${SOURCE#*@}"
          TAGS=("${REPO}:${TAG}")
          if [ "${IS_MAIN}" = "true" ]; then
            TAGS+=("${REPO}:latest" "ghcr.io/${ORG}/newwave4-frontend-production:${TAG}")
          fi
          ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=(-t "$t"); done
          docker buildx imagetools create --prefer-index=false "${ARGS[@]}" "${SOURCE}"
          for t in "${TAGS[@]}"; do
            GOT=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "${GOT}" != "${DIGEST}" ]; then
              echo "::error::${t} resolves to ${GOT}, expected the tested ${DIGEST}."
              exit 1
            fi
            echo "${t} -> ${DIGEST}"
          done
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  helm-publish:
    name: helm-publish
    needs: release
    # !cancelled(): see publish above.
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Checkout (branch HEAD, includes the semantic-release version-bump commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.4'

      - name: Login to GHCR for Helm (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package Helm chart
        id: pkg
        run: |
          set -euo pipefail
          PKG_FILE=$(helm package helm/frontend-chart | awk '{print $NF}')
          echo "pkg=${PKG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Push Helm chart to GHCR
        run: |
          set -euo pipefail
          helm push "${{ steps.pkg.outputs.pkg }}" oci://ghcr.io/${{ env.ORG }}/charts

  # Every published release goes to staging: dev prereleases from
  # development, and the X.Y.Z release from main (the same digest staging may
  # already run). `!cancelled()` + explicit results because helm-publish is
  # legitimately skipped on a force_build.
  deploy-staging:
    name: deploy-staging
    needs: [release, publish, helm-publish]
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && needs.publish.result == 'success'
      && (needs.helm-publish.result == 'success' || needs.helm-publish.result == 'skipped')
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      namespace: staging
      chart_version: ${{ needs.release.outputs.chart_version }}
      image_tag: ${{ needs.release.outputs.image_tag }}
      image_digest: ${{ needs.publish.outputs.digest }}
    secrets: inherit

  # Records "this run produced a production-deployable X.Y.Z, digest D" for
  # deploy-production.yml, which picks it up once this whole run (including
  # the staging rollout) has succeeded. The production rollout deliberately
  # does not run inside this workflow: a job waiting for approval would hold
  # the `release-<ref>` concurrency group and block every later release
  # (2026-11-15: v2.1.0 waited 11h and queued v2.1.1 behind it).
  # Release-only (no force_build): production takes only an exact X.Y.Z.
  production-candidate:
    name: production-candidate
    needs: [release, publish, helm-publish]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.release.outputs.new_release_published == 'true'
      && needs.publish.result == 'success'
      && needs.helm-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write candidate
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${VERSION}' is not an exact X.Y.Z release; not a production candidate."
            exit 1
          fi
          if ! echo "${DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::'${DIGEST}' is not an image digest."
            exit 1
          fi
          mkdir -p candidate
          printf '%s\n' "${VERSION}" > candidate/version
          printf '%s\n' "${DIGEST}" > candidate/digest
          echo "Production candidate: ${VERSION} (${DIGEST})"

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: production-release
          path: candidate/
          retention-days: 30
