name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Target environment (GitHub Environment name). staging -> cluster namespace newwave-dev, production -> newwave-prod'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      chart_version:
        description: 'Version of the Helm chart to deploy (e.g. 1.2.3 — must already be published)'
        required: true
      image_tag:
        description: 'Docker image tag to deploy (e.g. 1.2.3 — must already be published, "latest" is rejected for production)'
        required: true
      image_digest:
        description: 'Optional sha256:... to pin the pods to that exact image (release deploys always pass it; leave empty to deploy by tag, e.g. for a rollback)'
        required: false
        default: ''
  workflow_call:
    inputs:
      namespace:
        type: string
        required: true
      chart_version:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      image_digest:
        type: string
        required: false
        default: ''

# Ensure the workflow itself can read packages (GHCR) and repo contents
permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.namespace }}
    # One deploy per environment at a time; never cancel a rollout midway.
    concurrency:
      group: deploy-frontend-${{ inputs.namespace }}
      cancel-in-progress: false
    env:
      # The input names the GitHub Environment; the Kubernetes namespace is derived.
      # Both clusters (Infra rebuild 2026-10-31) use one namespace per environment.
      NAMESPACE: ${{ inputs.namespace == 'production' && 'newwave-prod' || 'newwave-dev' }}
      CHART_VERSION: ${{ inputs.chart_version }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      # Production pulls from its own repository name, which release.yml's
      # publish job points at the same tested digest as newwave4-frontend
      # (ADR 0008). The environment's values come from the runtime config below.
      IMAGE_NAME: ${{ inputs.namespace == 'production' && 'newwave4-frontend-production' || 'newwave4-frontend' }}
    steps:
      - name: Check image digest
        if: inputs.image_digest != ''
        run: |
          if ! echo "${IMAGE_DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::image_digest '${IMAGE_DIGEST}' is not sha256:<64 hex>."
            exit 1
          fi
          echo "Pods will run exactly ${IMAGE_NAME}@${IMAGE_DIGEST} (tag ${IMAGE_TAG})."

      - name: Guard production versions
        if: inputs.namespace == 'production'
        run: |
          if ! echo "${IMAGE_TAG}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to deploy image tag '${IMAGE_TAG}' to production — must be an exact published semver (e.g. 1.2.3), not 'latest', 'pr-*', or a '-dev.*' prerelease."
            exit 1
          fi
          if ! echo "${CHART_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to deploy chart version '${CHART_VERSION}' to production — must be an exact published semver (e.g. 1.2.3), not 'latest', 'pr-*', or a '-dev.*' prerelease."
            exit 1
          fi
          if [ "${CHART_VERSION}" != "${IMAGE_TAG}" ]; then
            echo "::error::chart_version (${CHART_VERSION}) and image_tag (${IMAGE_TAG}) must match — this repo's Helm chart version and app version are always released together (see docs/versioning.md), so a mismatch means the wrong pair was typed in."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      # Optional: install kubectl (ubuntu-latest usually has it, but this makes it explicit & pinned)
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          chmod 700 ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # Don't cat the whole kubeconfig (it can contain certs/tokens).
      # Show only the current context for sanity.
      - name: Debug cluster context (safe)
        run: |
          kubectl config current-context
          kubectl cluster-info

      - name: Ensure namespace exists
        run: |
          kubectl get ns "${{ env.NAMESPACE }}" >/dev/null 2>&1 || \
          kubectl create ns "${{ env.NAMESPACE }}"

      # Pinned to Helm 3: there `--atomic --wait` waits for workloads only.
      # Helm 4's default watcher also waits on cert-manager resources, which
      # blocks a deploy whenever a certificate is (re)issuing, and renames
      # --atomic. Bump deliberately, not via 'latest'.
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.17.3'

      # Login for Helm OCI (private charts). For public charts this is harmless.
      # Use a PAT with read:packages OR rely on GITHUB_TOKEN if the chart is in the same org and permissions allow it.
      - name: Login to GHCR for Helm
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GHCR_PASSWORD}" ]; then
            echo "No GHCR_PAT or GITHUB_TOKEN available with packages:read. Add a secret GHCR_PAT with read:packages."
            exit 1
          fi
          echo "${GHCR_PASSWORD}" | helm registry login ghcr.io --username "${GHCR_USER}" --password-stdin

      - name: Create values.yaml from Secret
        run: |
          echo "${{ secrets.VALUES_YAML }}" > ./values.yaml

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod a+x /usr/local/bin/yq

      - name: Validate values.yaml (structure only)
        run: |
          echo "Validating values.yaml..."
          if ! yq eval ./values.yaml >/dev/null 2>&1; then
            echo "Error: values.yaml is not valid YAML."
            exit 1
          fi
          echo "Top-level keys:"
          yq eval 'keys' ./values.yaml

      # `environment: production` resolves VALUES_YAML from that environment's
      # secrets -- but if the secret isn't set there, GitHub silently falls
      # back to the repo-level one, which holds staging's values. Catch that
      # before Helm turns it into a production release with a staging hostname.
      - name: Guard production values
        if: inputs.namespace == 'production'
        run: |
          hosts=$(yq eval '[.ingress.hosts[].host, .ingress.tls[].hosts[]] | .[]' ./values.yaml 2>/dev/null || true)
          if [ -z "${hosts}" ]; then
            echo "::error::values.yaml for production sets no ingress host -- the production VALUES_YAML secret is missing from the 'production' GitHub Environment (see docs/ci-cd.md, prerequisite 3)."
            exit 1
          fi
          if echo "${hosts}" | grep -qiE '(^|\.)(staging|stage|new)\.newwave4\.org$'; then
            echo "::error::values.yaml for production carries a staging hostname:"
            echo "${hosts}" | sed 's/^/  /'
            echo "::error::This is the repo-level (staging) VALUES_YAML leaking through -- add a production VALUES_YAML to the 'production' GitHub Environment."
            exit 1
          fi
          echo "Production ingress hosts:"
          echo "${hosts}" | sed 's/^/  /'

      # Public runtime config (utils/runtime-env.ts): the API origin, Stripe
      # publishable key and site URL the pods read at startup. Production reads
      # the repo-level PROD_* secrets; staging reads NEXT_PUBLIC_*, which inside
      # this job resolve to the `staging` Environment's copies where they exist.
      # The two are kept strictly apart: a missing production value fails here
      # rather than falling back to a staging one. Written last on the helm command line, so it wins over
      # anything VALUES_YAML still carries under `secret:`.
      - name: Write runtime config
        env:
          TARGET: ${{ inputs.namespace }}
          STAGING_API_URL: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL }}
          STAGING_STRIPE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS }}
          STAGING_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          PROD_API_URL: ${{ secrets.PROD_NEXT_PUBLIC_NEWWAVE_API_URL }}
          PROD_STRIPE_KEY: ${{ secrets.PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS }}
          PROD_SITE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          if [ "${TARGET}" = "production" ]; then
            API_URL="${PROD_API_URL}"; STRIPE_KEY="${PROD_STRIPE_KEY}"; SITE_URL="${PROD_SITE_URL}"; PREFIX=PROD_NEXT_PUBLIC
          else
            API_URL="${STAGING_API_URL}"; STRIPE_KEY="${STAGING_STRIPE_KEY}"; SITE_URL="${STAGING_SITE_URL}"; PREFIX=NEXT_PUBLIC
          fi
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          API_URL=$(trim "${API_URL}"); STRIPE_KEY=$(trim "${STRIPE_KEY}"); SITE_URL=$(trim "${SITE_URL}")
          API_URL="${API_URL%/}"; SITE_URL="${SITE_URL%/}"

          fail=0
          [ -z "${API_URL}" ] && { echo "::error::${PREFIX}_NEWWAVE_API_URL is not set."; fail=1; }
          [ -z "${STRIPE_KEY}" ] && { echo "::error::${PREFIX}_STRIPE_PUBLISHABLE_KEYS is not set."; fail=1; }
          # Not derived from the ingress hosts: the canonical origin is not
          # always the first one (production lists www.newwave4.org first).
          [ -z "${SITE_URL}" ] && { echo "::error::${PREFIX}_SITE_URL is not set."; fail=1; }
          echo "${API_URL}" | grep -qE '^https?://[^/]+$' || { echo "::error::API URL must be an origin like https://api.example.org (no path)."; fail=1; }
          echo "${SITE_URL}" | grep -qE '^https?://[^/]+$' || { echo "::error::Site URL must be an origin like https://example.org (no path)."; fail=1; }
          if [ "${TARGET}" = "production" ]; then
            case "${STRIPE_KEY}" in pk_live_*) ;; *) echo "::error::Production needs a live Stripe publishable key (pk_live_...)."; fail=1 ;; esac
            if echo "${API_URL} ${SITE_URL}" | grep -qiE '(stage|staging|//new\.)'; then
              echo "::error::Production runtime config points at a staging host: API ${API_URL}, site ${SITE_URL}."; fail=1
            fi
          fi
          [ "${fail}" = 0 ] || exit 1

          export API_URL STRIPE_KEY SITE_URL
          yq -n '.secret.NEXT_PUBLIC_NEWWAVE_API_URL = strenv(API_URL)
            | .secret.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS = strenv(STRIPE_KEY)
            | .secret.NEXT_PUBLIC_SITE_URL = strenv(SITE_URL)' > ./runtime-values.yaml
          chmod 600 ./runtime-values.yaml
          echo "Runtime config for ${TARGET}: API ${API_URL}, site ${SITE_URL}, Stripe key ${STRIPE_KEY:0:8}..."

      # GITHUB_TOKEN expires when this job ends, so a pull secret built from it
      # stops working as soon as a pod is rescheduled onto a node that hasn't
      # cached the image. Production has 3 nodes and must not depend on that:
      # require the long-lived GHCR_PAT (read:packages) from its Environment.
      - name: Create/Update imagePullSecret for GHCR
        env:
          HAS_PAT: ${{ secrets.GHCR_PAT != '' }}
        run: |
          if [ "${{ inputs.namespace }}" = "production" ] && [ "${HAS_PAT}" != "true" ]; then
            echo "::error::GHCR_PAT is not set in the 'production' GitHub Environment; refusing to write a pull secret from the short-lived GITHUB_TOKEN."
            exit 1
          fi
          kubectl create secret docker-registry ghcr-regcred \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" \
            --docker-email="actions@github.com" \
            --namespace "${{ env.NAMESPACE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Correct GHCR debug: use Bearer from token service and FULL repo path
      - name: Debug OCI Registry access (optional)
        env:
          ORG: ${{ env.ORG }}
          REPO_PATH: charts/newwave4-frontend-chart
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if we can access GHCR tags list for ${ORG}/${REPO_PATH}..."
          SCOPE="repository:${ORG}/${REPO_PATH}:pull"
          if [ -n "${GHCR_PASSWORD}" ]; then
            BEARER=$(curl -s -u "${GHCR_USER}:${GHCR_PASSWORD}" \
              "https://ghcr.io/token?service=ghcr.io&scope=${SCOPE}" | jq -r .token)
          else
            BEARER=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=${SCOPE}" | jq -r .token)
          fi
          curl -s -H "Authorization: Bearer ${BEARER}" \
            "https://ghcr.io/v2/${ORG}/${REPO_PATH}/tags/list" || echo "Failed to list tags"

      # --atomic --wait: the run only goes green once every pod passes its
      # readiness probe; a crash-looping or unpullable image fails the run and
      # Helm rolls the release back to the previous revision.
      - name: Helm Upgrade/Install
        run: |
          echo "Installing chart from OCI repository..."
          helm upgrade --install newwave4-frontend \
            oci://ghcr.io/${{ env.ORG }}/charts/newwave4-frontend-chart \
            --version "${{ env.CHART_VERSION }}" \
            --namespace "${{ env.NAMESPACE }}" \
            --create-namespace \
            -f helm/frontend-chart/values.yaml \
            -f ./values.yaml \
            -f ./runtime-values.yaml \
            --set image.repository=ghcr.io/${{ env.ORG }}/${{ env.IMAGE_NAME }} \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set-string image.digest="${IMAGE_DIGEST}" \
            --set imagePullSecrets[0].name=ghcr-regcred \
            --atomic --wait --timeout 10m

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          shred -u ./values.yaml || rm -f ./values.yaml
          shred -u ./runtime-values.yaml 2>/dev/null || rm -f ./runtime-values.yaml
