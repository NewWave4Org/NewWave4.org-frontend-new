name: Quality Gates

# Reusable workflow: the actual quality gates every change goes through.
# Called by ci.yml (feature/fix branches, PRs) and release.yml (main/development pushes).
on:
  workflow_call:

jobs:
  casing-guard:
    name: casing-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Guard mis-cased import paths
        run: |
          set -e
          bad=0
          # Folder casing
          if grep -RInE "@/components/Payment/|\.\./Payment/" --include=\*.{ts,tsx,js,jsx} app components; then
            echo "Found '/components/Payment/'. Use '/components/payment/'."
            bad=1
          fi
          # Component casing (imports vs file)
          if grep -RIn "PayPalComponent" --include=\*.{ts,tsx,js,jsx} app components; then
            echo "Found 'PayPalComponent' in imports. Standardize on 'PaypalComponent' OR provide shim."
          fi
          # Ensure required file exists with correct casing
          if [ ! -f components/payment/PaypalComponent.tsx ]; then
            echo "Missing components/payment/PaypalComponent.tsx (check case)."
            bad=1
          fi
          exit $bad

  no-console-log:
    name: no-console-log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # eslint.config.mjs carries a matching no-console rule, but `npm run lint`
      # cannot run at all under TypeScript 7 (issue #454), so that rule enforces
      # nothing today. This grep does, and it is why 66 console.log calls could
      # accumulate across 32 files unnoticed (issue #457) -- among them a
      # plaintext password and donor PII written to the browser console.
      #
      # console.error/console.warn are deliberately allowed: they are real
      # diagnostics. Only log/info are debug leftovers.
      #
      # scripts/ and e2e/ are excluded -- Node CLI tools and test harnesses
      # where writing to stdout is the entire point.
      - name: Guard against console.log/console.info in shipped code
        run: |
          set -e
          if grep -RInE "console\.(log|info)\s*\(" \
               --include=\*.{ts,tsx,js,jsx} \
               app components utils store stores i18n middleware.ts; then
            echo "::error::Found console.log/console.info in shipped code. Use console.error or console.warn for real diagnostics, or remove the call."
            exit 1
          fi
          echo "No console.log/console.info found in shipped code."

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # `format:check` existed but was wired into no workflow, so 320 files had
      # drifted out of style with nothing to catch it (issue #455). Blocking
      # from the start: the tree was formatted in the same PR that added this,
      # so it starts green and can only be broken deliberately.
      #
      # See .prettierignore — helm/**/templates/ is excluded because Go
      # templating is not valid YAML and Prettier throws a hard SyntaxError on
      # it, which would make this job unpassable.
      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Blocking since 2026-07-31: the 36-error backlog that forced
      # continue-on-error is paid off (issue #453) and the tree is clean, so
      # this is now the ratchet — any new type error fails the build.
      - name: Type check
        run: npx tsc --noEmit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Non-blocking: typescript@7.0.2 is incompatible with eslint-config-next's
      # bundled typescript-eslint (upstream blocker, see CLAUDE.md and
      # docs/decisions/0003-lint-non-blocking-pending-ts7-support.md).
      - name: Lint (non-blocking, see docs/known-issues.md)
        continue-on-error: true
        run: npx eslint .

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # There is deliberately no standalone `build` job (`npm run build` on the
  # bare runner or in a plain container). It was found to crash silently and
  # deterministically — Next.js prints "Skipping validation of types" then
  # the process dies with no error output — specifically on GitHub Actions'
  # own infrastructure. Root cause not isolated despite extensive attempts
  # (ruled out: this repo's own code, a poisoned npm cache, running inside
  # the exact node:20-alpine image `docker-smoke` uses, a fresh git-clone-
  # inside-container with zero macOS-originated files); it never reproduced
  # in any local Docker build, only in GitHub's actual runner/container
  # execution. `docker-smoke` below already fully exercises the same `next
  # build` via the real Dockerfile (a proven-reliable path — this job has
  # never failed) and is arguably the more representative check anyway,
  # since it builds the exact artifact that gets deployed. See
  # docs/known-issues.md.
  docker-smoke:
    name: docker-smoke
    needs: casing-guard
    runs-on: ubuntu-latest
    env:
      # Dependabot and fork PRs run without access to repo secrets. generate-env
      # then writes empty values, utils/env.ts fails the build on three missing
      # required vars, and docker-smoke fails — a *required* status check, so
      # every dependency update including security ones was permanently
      # unmergeable. This flag lets the job fall back to committed placeholders.
      HAS_SECRETS: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Org Lowercase
        uses: ./.github/actions/set-org-lowercase

      - name: Generate .env file
        if: env.HAS_SECRETS == 'true'
        uses: ./.github/actions/generate-env
        with:
          paypal_client_id: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          stripe_publishable_keys: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS }}
          stripe_webhook_url: ${{ secrets.NEXT_PUBLIC_STRIPE_WEBHOOK_URL }}
          newwave_api_url: ${{ secrets.NEXT_PUBLIC_NEWWAVE_API_URL }}
          site_url: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # `.env.ci` is committed, non-secret, and points at https://ci.invalid.
      # Verified locally that a real image built from it starts and serves the
      # homepage, so both smoke assertions still mean something: this checks the
      # app compiles and boots, which is exactly what a dependency bump needs.
      # It cannot mask a missing production secret, because this job only builds
      # (`push: false`) — nothing published or deployed comes from here.
      - name: Use committed CI placeholders (no secrets on Dependabot/fork PRs)
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::notice::No repo secrets available (Dependabot or fork PR) — building with .env.ci placeholders."
          cp .env.ci .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ env.ORG }}/newwave4-frontend:${{ github.sha }}
          # Not a real release, so APP_VERSION keeps its 0.0.0-dev default --
          # but stamping the commit still lets the smoke test below assert the
          # ARG -> ENV -> /api/version chain actually works, which is the point.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ github.sha }}

      - name: Docker image smoke test
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          # -e and -u, but deliberately NOT pipefail: `grep -q` exits as soon as
          # it matches, which SIGPIPEs the wget feeding it. Under pipefail that
          # would fail a check that has always passed.
          set -eu
          docker run --name newwave4-frontend-app -d -p 3000:3000 ghcr.io/${{ env.ORG }}/newwave4-frontend:${{ github.sha }}
          echo Testing Image URL using wget
          # Checks for a valid HTML response rather than specific brand text, since the
          # homepage's default locale (UA) legitimately renders its title/branding in
          # Ukrainian, not the English "New Wave" string.
          wget -q -O - 127.0.0.1:3000 | grep -qi "<!DOCTYPE html"

          # The status page's drift detection is only as good as this endpoint,
          # and a silent regression here would degrade it to a permanent
          # "running version unknown" that nobody would notice. Assert the whole
          # chain: the route responds, and the build args really did reach it.
          echo Testing /api/version
          curl -fsS --max-time 10 127.0.0.1:3000/api/version -o /tmp/version.json
          cat /tmp/version.json
          jq -e --arg expected "$EXPECTED_COMMIT" \
            '.version and .startedAt and (.commit == $expected)' /tmp/version.json > /dev/null
