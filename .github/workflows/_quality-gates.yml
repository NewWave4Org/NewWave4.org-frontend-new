name: Quality Gates

# Reusable workflow: the quality gates every change goes through, and the one
# place the app image is built. Called by ci.yml (pull requests, feature/fix
# branches) and release.yml (pushes to main/development).
#
# The image carries no environment values (utils/runtime-env.ts): the same
# build serves staging and production. release.yml tags the digest built here
# as the release; it never rebuilds.
#
# Job names are what branch protection requires on `development`
# (quality-gates / casing-guard, unit-test, docker-smoke). Rename one only
# together with the protection settings.
on:
  workflow_call:
    inputs:
      run_full:
        description: >-
          When false, every job below still runs and reports its check, but does
          no work. Used for documentation-only pull requests (see ci.yml).
          The jobs must not be skipped outright: their check names are
          required by branch protection, and a job that never exists never
          reports, leaving the PR blocked on a check that can never arrive.
        type: boolean
        required: false
        default: true
      push_image:
        description: >-
          Push the image to GHCR as `sha-<commit>` (plus extra_tag) and smoke-test
          the pushed digest. False for Dependabot and fork PRs, which get no
          write token: the image is then built and tested locally only.
        type: boolean
        required: false
        default: false
      image_name:
        description: >-
          GHCR package to push to. ci.yml uses newwave4-frontend-pr: pull
          request images never land in the package releases promote from.
        type: string
        required: false
        default: newwave4-frontend
      extra_tag:
        description: Optional second tag for the pushed image (e.g. pr-12-<sha>).
        type: string
        required: false
        default: ''
    outputs:
      image:
        description: The pushed image as repo@sha256:digest; empty when not pushed.
        value: ${{ jobs.docker-smoke.outputs.image }}

jobs:
  # Cheap source guards, no install.
  casing-guard:
    name: casing-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        if: inputs.run_full
        uses: actions/checkout@v7

      - name: Guard mis-cased import paths
        if: inputs.run_full
        run: |
          set -e
          if grep -RInE "@/components/Payment/|\.\./Payment/" --include=\*.{ts,tsx,js,jsx} app components; then
            echo "::error::Found '/components/Payment/'. Use '/components/payment/'."
            exit 1
          fi

      # eslint.config.mjs carries a matching no-console rule, but `npm run lint`
      # cannot run under TypeScript 7 (ADR 0003), so this grep is what enforces
      # it. console.error/console.warn stay allowed: they are real diagnostics.
      # scripts/ and e2e/ are excluded: writing to stdout is their job.
      - name: Guard against console.log/console.info in shipped code
        if: inputs.run_full
        run: |
          set -e
          if grep -RInE "console\.(log|info)\s*\(" \
               --include=\*.{ts,tsx,js,jsx} \
               app components utils store stores i18n middleware.ts instrumentation.ts; then
            echo "::error::Found console.log/console.info in shipped code. Use console.error or console.warn for real diagnostics, or remove the call."
            exit 1
          fi
          echo "No console.log/console.info found in shipped code."

  # Every Node check behind a single `npm ci` (it used to be four jobs, four
  # installs). Each step still fails the job on its own.
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        if: inputs.run_full

      - uses: actions/setup-node@v7
        if: inputs.run_full
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
        if: inputs.run_full

      - name: Check formatting
        if: inputs.run_full
        run: npm run format:check

      - name: Type check
        if: inputs.run_full
        run: npx tsc --noEmit

      # Non-blocking: typescript-eslint cannot load under TypeScript 7 and
      # crashes before linting anything. See ADR 0003 and lint-compat-check.yml.
      - name: Lint (non-blocking, see docs/known-issues.md)
        if: inputs.run_full
        continue-on-error: true
        run: npx eslint .

      - name: Unit tests with coverage
        if: inputs.run_full
        run: npm run test:coverage

      - name: Upload coverage
        if: always() && inputs.run_full
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Builds the image once. When push_image is set, pushes it and smoke-tests
  # the exact pushed digest, which is what release.yml later tags and deploys.
  docker-smoke:
    name: docker-smoke
    needs: casing-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout Repository
        if: inputs.run_full
        uses: actions/checkout@v7

      - name: Set Org Lowercase
        if: inputs.run_full
        uses: ./.github/actions/set-org-lowercase

      - name: GHCR Login
        if: inputs.run_full && inputs.push_image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: inputs.run_full
        uses: docker/setup-buildx-action@v4

      - name: Image tags
        if: inputs.run_full
        id: tags
        env:
          REPO: ghcr.io/${{ env.ORG }}/${{ inputs.image_name }}
          EXTRA: ${{ inputs.extra_tag }}
        run: |
          {
            echo "tags<<EOF"
            echo "${REPO}:sha-${GITHUB_SHA}"
            [ -n "${EXTRA}" ] && echo "${REPO}:${EXTRA}"
            echo "EOF"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # No env values go in (.dockerignore excludes .env). provenance off keeps
      # a single image manifest, so the digest and labels read back simply
      # (release.yml reads org.opencontainers.image.revision from it).
      - name: Build (and push) image
        if: inputs.run_full
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push_image }}
          load: ${{ !inputs.push_image }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.tags.outputs.built_at }}

      - name: Resolve the image under test
        if: inputs.run_full
        id: ref
        env:
          REPO: ghcr.io/${{ env.ORG }}/${{ inputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ inputs.push_image }}
        run: |
          set -euo pipefail
          if [ "${PUSHED}" = "true" ]; then
            IMAGE="${REPO}@${DIGEST}"
            docker pull -q "${IMAGE}"
            echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          else
            IMAGE="${REPO}:sha-${GITHUB_SHA}"
          fi
          echo "under_test=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Testing ${IMAGE}"

      - name: Docker image smoke test
        if: inputs.run_full
        env:
          IMAGE: ${{ steps.ref.outputs.under_test }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          # Placeholder runtime config, passed the way the Helm chart passes the
          # real one. The image carries none of its own.
          docker run --name newwave4-frontend-app -d -p 3000:3000 --env-file .env.ci "${IMAGE}"
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null --max-time 5 127.0.0.1:3000/robots.txt && break
            sleep 1
          done

          echo Testing that the app serves HTML
          # A valid HTML response rather than brand text: the default locale
          # (UA) renders its title in Ukrainian. -L: / redirects to the locale
          # (307 to /ua) with an empty body.
          curl -fsSL --max-time 20 127.0.0.1:3000 | grep -qi "<!DOCTYPE html"

          # The status page's drift detection is only as good as this endpoint.
          echo Testing /api/version
          curl -fsS --max-time 10 127.0.0.1:3000/api/version -o /tmp/version.json
          cat /tmp/version.json
          jq -e --arg expected "$EXPECTED_COMMIT" \
            '.version and .startedAt and (.commit == $expected)' /tmp/version.json > /dev/null

          # Runtime config (utils/runtime-env.ts) must reach the browser: the
          # page carries the API origin from the env file, not from the build.
          echo Testing runtime config injection
          API_URL=$(sed -n 's/^NEXT_PUBLIC_NEWWAVE_API_URL=//p' .env.ci)
          curl -fsSL --max-time 20 127.0.0.1:3000/donation \
            | grep -o '<script id="nw-public-env">[^<]*' \
            | grep -qF "\"NEXT_PUBLIC_NEWWAVE_API_URL\":\"${API_URL%/}"

          # ...and an image started without it must refuse to start
          # (instrumentation.ts), not serve a half-configured site.
          echo Testing that a container without config exits
          set +e
          timeout 60 docker run --rm "${IMAGE}"
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::A container without runtime config did not exit with an error (exit ${code})."
            exit 1
          fi
          echo "Exited with ${code}, as expected."

      - name: Container logs
        if: failure() && inputs.run_full
        run: docker logs newwave4-frontend-app || true
