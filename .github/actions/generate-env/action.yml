name: Generate .env file
description: >
  Writes the NEXT_PUBLIC_* build-time env vars to a .env file at the repo
  root from the given values. Previously copy-pasted into 3 separate steps
  across 3 workflow files (and had already drifted once — one copy was
  missing NEXT_PUBLIC_STRIPE_WEBHOOK_URL); consolidated here so all four
  required vars (per CLAUDE.md) can't silently diverge between call sites
  again.
inputs:
  paypal_client_id:
    required: true
  stripe_publishable_keys:
    required: true
  stripe_webhook_url:
    required: true
  newwave_api_url:
    required: true
  base_path:
    required: false
    default: ''
  site_url:
    description: >
      Public origin this deployment serves from, no trailing slash. Consumed by
      utils/seo.ts for canonical URLs, hreflang alternates and sitemap.xml.
      Optional: when empty the line is omitted entirely so utils/seo.ts's
      fallback applies, which is correct for staging but wrong for production.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "NEXT_PUBLIC_BASE_PATH=${{ inputs.base_path }}" > .env
        echo "NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ inputs.paypal_client_id }}" >> .env
        echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS=${{ inputs.stripe_publishable_keys }}" >> .env
        echo "NEXT_PUBLIC_STRIPE_WEBHOOK_URL=${{ inputs.stripe_webhook_url }}" >> .env
        echo "NEXT_PUBLIC_NEWWAVE_API_URL=${{ inputs.newwave_api_url }}" >> .env

        # Written only when provided. An empty NEXT_PUBLIC_SITE_URL= line would
        # be harmless today ('' is falsy, so the fallback still wins) but it
        # reads as "explicitly configured to nothing", which is worse to debug
        # than simply being absent.
        if [ -n "${{ inputs.site_url }}" ]; then
          echo "NEXT_PUBLIC_SITE_URL=${{ inputs.site_url }}" >> .env
        fi
