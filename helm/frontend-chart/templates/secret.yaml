{{- /*
  Public runtime config, read by the app at startup (utils/runtime-env.ts) and
  checked there (instrumentation.ts): a pod missing a value refuses to start.
  deploy-to-kubernetes.yml fills these in per environment, so one image serves
  staging and production. Only keys with a value are written; an absent key
  fails the startup check loudly instead of arriving as an empty string.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  {{- if .Values.namespaceOverride }}
  namespace: {{ .Values.namespaceOverride }}
  {{- end }}
type: Opaque
data:
  {{- range $key := list "NEXT_PUBLIC_NEWWAVE_API_URL" "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEYS" "NEXT_PUBLIC_SITE_URL" }}
  {{- with index ($.Values.secret | default dict) $key }}
  {{ $key }}: {{ . | toString | b64enc }}
  {{- end }}
  {{- end }}
